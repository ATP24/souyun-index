<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜韵网收录诗文出处循证系统 · 快捷入口</title>
    <style>
        :root {
            --bg-color: #f9f7f1;
            --text-main: #2b2b2b;
            --text-light: #5e5951;
            --primary: #8c4356;
            --border-color: #d8cebe;
            --font-classical: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
        }
        body {
            font-family: var(--font-classical);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .portal-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 40px 48px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        h1 {
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 10px 0;
            letter-spacing: 3px;
            font-weight: normal;
        }
        p.sub {
            color: var(--text-light);
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .divider {
            margin: 20px 0;
            color: #b5a997;
            font-size: 13px;
            letter-spacing: 4px;
        }
        .divider::before, .divider::after {
            content: '——';
            margin: 0 10px;
            color: #d8cebe;
        }
        .status-box {
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 3px;
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
        }
        .status-connecting {
            background: #f4efe4;
            color: #6a5740;
            border-left: 3px solid #b5a082;
        }
        .status-ready {
            background: #f1f7f3;
            color: #2e5e3d;
            border-left: 3px solid #3d664a;
        }
        .status-waiting {
            background: #faf4f5;
            color: #723444;
            border-left: 3px solid var(--primary);
        }
        .steps-box {
            margin: 20px 0;
            text-align: left;
            font-size: 13.5px;
            color: var(--text-main);
            background: #faf8f4;
            padding: 18px 24px;
            border: 1px dashed var(--border-color);
            line-height: 2;
        }
        .steps-box ol {
            margin: 0;
            padding-left: 20px;
        }
        .btn-action {
            display: inline-block;
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
            font-family: var(--font-classical);
            font-size: 15px;
            padding: 10px 28px;
            cursor: pointer;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.2s;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .btn-action:hover {
            background: #723444;
            border-color: #723444;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1>搜韵网收录诗文出处循证系统</h1>
        <p class="sub">寻根溯源 · 明辨底本</p>

        <div class="divider">快捷就绪视窗</div>

        <div id="statusBox" class="status-box status-connecting">
            ⏳ 正在探测本地运行服务 (http://localhost:8080) ...
        </div>

        <div id="stepsBox" class="steps-box" style="display: none;">
            <strong>【服务启动指引】</strong>
            <ol>
                <li>在项目根目录下，直接双击运行 <strong><code>启动系统.bat</code></strong> 或 <strong><code>main.py</code></strong>；</li>
                <li>如未安装 Python，可直接运行 <strong><code>dist/souyun-index-windows.exe</code></strong>；</li>
                <li>启动后服务将自动在浏览器中打开，本视窗检测到服务后亦会自动跳转。</li>
            </ol>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn-action" id="actionBtn" onclick="checkAndRedirect(true)">🔄 重新探测并进入系统</button>
        </div>
    </div>

    <script>
        const PORTS = [8080, 8081, 8082, 8088, 8090];

        async function probePort(port) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1000);
                const res = await fetch(`http://127.0.0.1:${port}/api/ping`, {
                    signal: controller.signal,
                    mode: 'cors'
                });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.app === 'souyun-index') return true;
                }
            } catch (e) {}
            return false;
        }

        async function checkAndRedirect(manual = false) {
            const statusBox = document.getElementById('statusBox');
            const stepsBox = document.getElementById('stepsBox');
            const actionBtn = document.getElementById('actionBtn');

            statusBox.className = 'status-box status-connecting';
            statusBox.innerHTML = '⏳ 正在检测本地后台服务状态...';

            for (const port of PORTS) {
                const isRunning = await probePort(port);
                if (isRunning) {
                    statusBox.className = 'status-box status-ready';
                    statusBox.innerHTML = `✅ 检测到本地服务已就绪 (端口 ${port})，正在为您进入系统...`;
                    stepsBox.style.display = 'none';
                    actionBtn.textContent = '🚀 立即进入系统';
                    actionBtn.onclick = () => window.location.href = `http://localhost:${port}`;
                    setTimeout(() => {
                        window.location.href = `http://localhost:${port}`;
                    }, 600);
                    return;
                }
            }

            // 未检测到服务运行
            statusBox.className = 'status-box status-waiting';
            statusBox.innerHTML = '⚠️ <strong>本地服务尚未启动</strong><br>系统需要本地轻量通信服务以提供古籍图谱逆向溯源。请参考下方指引启动：';
            stepsBox.style.display = 'block';
            actionBtn.textContent = '🔄 服务已启动？点击重新探测';
            actionBtn.onclick = () => checkAndRedirect(true);
        }

        // 页面载入时立即自动探活
        window.addEventListener('DOMContentLoaded', () => {
            checkAndRedirect();
            // 每隔 2 秒自动重试一次
            setInterval(() => {
                if (document.getElementById('stepsBox').style.display !== 'none') {
                    checkAndRedirect();
                }
            }, 2500);
        });
    </script>
</body>
</html>
