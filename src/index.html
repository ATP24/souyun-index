<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜韵网收录诗文出处循证系统</title>
    <style>
        :root {
            /* 古典文人书斋配色 */
            --bg-color: #f9f7f1;       /* 宣纸暖白 */
            --card-bg: #ffffff;        /* 纯净衬纸 */
            --card-sub: #fdfcf9;       /* 文卷微暖 */
            --text-main: #2b2b2b;      /* 徽墨 */
            --text-light: #5e5951;     /* 松烟淡墨 */
            --border-color: #d8cebe;   /* 苍黄细线 */
            --border-subtle: #eae2d3;  /* 卷折暗痕 */
            --primary: #8c4356;        /* 胭脂 */
            --primary-hover: #723444;  /* 熟胭脂 */
            --badge-green: #3d664a;    /* 竹青 */
            --badge-blue: #446581;     /* 靛蓝 */
            --badge-purple: #6a4a6b;   /* 紫檀 */
            --badge-gray: #78756e;     /* 苍石 */

            /* 古籍典雅字体系列 */
            --font-classical: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
        }

        body {
            font-family: var(--font-classical);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ---------------------------------------------
           大中至正排版 (Hero Section) 
           --------------------------------------------- */
        .hero-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 65vh;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .hero-wrapper.compact {
            min-height: 0;
            padding-top: 15px;
            margin-bottom: 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            width: 100%;
        }
        
        .header h1 { 
            margin: 0 0 10px 0; 
            font-size: 40px; 
            font-weight: normal;
            letter-spacing: 4px;
            color: var(--primary);
            transition: font-size 0.5s ease;
        }
        
        .hero-wrapper.compact .header h1 {
            font-size: 26px;
        }
        
        .subtitle { 
            margin: 0; 
            font-size: 15px; 
            color: var(--text-light);
            letter-spacing: 3px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 650px;
            position: relative;
            z-index: 100;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 17px;
            font-family: var(--font-classical);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        button.main-btn {
            padding: 15px 34px;
            background-color: var(--primary);
            color: #f9f7f1;
            border: none;
            font-family: var(--font-classical);
            font-size: 17px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(140, 67, 86, 0.2);
            flex-shrink: 0;
        }

        button.main-btn:hover { background-color: var(--primary-hover); }
        button.main-btn:disabled { background-color: #a89f91; cursor: not-allowed; box-shadow: none; }

        /* ---------------------------------------------
           全局格式切换与整页引文复制栏
           --------------------------------------------- */
        .global-format-selector {
            background: transparent;
            padding: 12px 4px;
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-group { 
            display: flex; 
            gap: 18px; 
            flex-wrap: wrap;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14.5px;
            color: var(--text-main);
            user-select: none;
        }

        .format-actions {
            margin-left: auto;
        }

        .action-btn {
            font-size: 12.5px;
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border: 1px solid #d8bec4;
            background: #ffffff;
            transition: all 0.2s;
            cursor: pointer;
            font-family: var(--font-classical);
            border-radius: 2px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        .action-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .status-bar {
            padding: 12px 18px;
            margin-bottom: 22px;
            text-align: center;
            display: none;
            font-size: 14.5px;
            border: 1px solid transparent;
        }
        .status-loading { color: var(--badge-blue); border-color: #d1d9e0; background: #eef2f5; }
        .status-error { color: var(--primary); border-color: #e2c8ce; background: #f7ebee; }
        .status-success { color: var(--badge-green); border-color: #c9d8ce; background: #eaf1ec; }

        /* ---------------------------------------------
           古典风格诗文卡片 (绝无奇怪勾选框与AI杂质)
           --------------------------------------------- */
        .poem-card {
            background: var(--card-bg);
            padding: 35px 32px 30px;
            margin-bottom: 35px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.025);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .poem-card::before, .poem-card::after {
            content: '';
            position: absolute;
            left: 6px; right: 6px;
            height: 1px;
            background: var(--border-subtle);
        }
        .poem-card::before { top: 6px; }
        .poem-card::after { bottom: 6px; }

        .poem-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .poem-title { 
            font-size: 24px; 
            font-weight: normal; 
            color: var(--text-main); 
            margin: 0 0 8px 0; 
            letter-spacing: 2px;
        }
        .poem-meta { 
            color: var(--text-light); 
            font-size: 14px; 
            display: flex; 
            justify-content: center;
            gap: 15px; 
        }

        /* 诗文展开与折叠 */
        .poem-content-wrapper {
            margin: 22px 0;
            font-size: 17px;
            line-height: 2.1;
            text-align: center;
            padding: 0 35px;
        }
        
        .poem-content {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        
        .poem-content.expanded {
            -webkit-line-clamp: unset;
        }

        /* ---------------------------------------------
           传统朱砂圈点/朱笔句读式关键词高亮 (典雅文人书斋风格)
           --------------------------------------------- */
        .keyword-highlight {
            color: var(--primary);
            background-color: rgba(140, 67, 86, 0.08);
            border-bottom: 1.5px solid rgba(140, 67, 86, 0.45);
            padding: 1px 3px 2px 3px;
            border-radius: 2px;
            font-weight: 500;
            display: inline;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            transition: all 0.2s ease;
        }

        .keyword-highlight:hover {
            background-color: rgba(140, 67, 86, 0.16);
            border-bottom-color: var(--primary);
        }

        /* 诗歌题目中的高亮：保持标题大字疏朗气象，去底色，以朱笔下划线微染标出 */
        .poem-title .keyword-highlight {
            background-color: transparent;
            border-bottom: 2px solid var(--primary);
            padding: 0 2px;
            font-weight: normal;
        }

        /* 作者与朝代元数据中的高亮 */
        .poem-meta .keyword-highlight {
            background-color: transparent;
            border-bottom: 1.5px solid var(--primary);
            padding: 0 2px;
            font-weight: normal;
        }

        /* 文献出处标题中的高亮 */
        .source-meta-title .keyword-highlight {
            background-color: transparent;
            border-bottom: 1.5px solid var(--primary);
            padding: 0 1px;
            font-weight: normal;
        }
        
        .poem-gradient {
            position: relative;
            margin-top: -35px;
            height: 50px;
            background: linear-gradient(transparent, var(--card-bg) 80%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2px;
        }
        
        .poem-content.expanded + .poem-gradient {
            background: transparent;
            margin-top: 10px;
        }

        .expand-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            font-family: var(--font-classical);
            padding: 2px 14px;
            font-size: 12.5px;
            cursor: pointer;
            z-index: 10;
        }
        .expand-btn:hover { background: #e8e2d2; color: var(--text-main); }

        /* ---------------------------------------------
           古典风格分割线 (典雅中正)
           --------------------------------------------- */
        .classical-divider {
            text-align: center;
            margin: 26px 0 16px;
            color: #948b7d;
            font-size: 13px;
            letter-spacing: 4px;
        }
        .classical-divider::before, .classical-divider::after {
            content: '——';
            margin: 0 12px;
            color: #d1c7b7;
            font-weight: normal;
        }

        /* ---------------------------------------------
           历代名家汇评与诗话集释面板 (典雅文人辑评体例)
           --------------------------------------------- */
        .criticism-container {
            margin: 20px 0 10px 0;
            background: #faf8f3;
            border: 1px solid #e8dfd1;
            border-radius: 2px;
            transition: all 0.25s ease;
        }

        .criticism-details summary {
            padding: 10px 16px;
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            font-size: 13.5px;
            color: var(--text-main);
            user-select: none;
            background: #f7f4ec;
            border-bottom: 1px solid transparent;
            transition: background 0.2s;
        }

        .criticism-details summary::-webkit-details-marker {
            display: none;
        }

        .criticism-details[open] summary {
            border-bottom-color: #e8dfd1;
            background: #f4efe4;
        }

        .criticism-badge {
            background: rgba(140, 67, 86, 0.08);
            color: var(--primary);
            border: 1px solid rgba(140, 67, 86, 0.3);
            font-size: 11.5px;
            padding: 1px 6px;
            margin-right: 8px;
            border-radius: 2px;
            letter-spacing: 0.5px;
        }

        .criticism-title {
            font-family: var(--font-classical);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .criticism-count {
            color: var(--text-light);
            font-size: 12px;
            margin-left: 6px;
        }

        .criticism-arrow {
            margin-left: auto;
            color: var(--text-light);
            font-size: 11px;
            transition: transform 0.2s;
        }

        .criticism-details[open] .criticism-arrow {
            transform: rotate(180deg);
        }

        .criticism-list {
            padding: 8px 16px;
            max-height: 380px;
            overflow-y: auto;
        }

        .criticism-item {
            padding: 10px 0;
            border-bottom: 1px dashed #e7e0d3;
            line-height: 1.85;
        }

        .criticism-item:last-child {
            border-bottom: none;
        }

        .criticism-book {
            color: var(--primary);
            font-weight: 500;
            font-size: 13.5px;
            margin-bottom: 3px;
            display: inline-block;
        }

        .criticism-content {
            color: #3b3631;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-align: justify;
        }

        /* ---------------------------------------------
           出处卡片设计 (彻底去除AI感框与竖纹，回归典雅学人书叶风格)
           --------------------------------------------- */
        .source-container {
            margin-bottom: 14px;
        }
        .source-container:last-child {
            margin-bottom: 0;
        }

        .source-card {
            background: var(--card-sub);
            border: 1px solid #eae2d3;
            border-radius: 2px;
            padding: 14px 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .source-card:hover {
            border-color: #d6cab8;
            box-shadow: 0 2px 8px rgba(140, 67, 86, 0.04);
        }

        .source-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 9px;
            margin-bottom: 9px;
            border-bottom: 1px solid #f1ece1;
        }
        
        .source-meta-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .badge {
            flex-shrink: 0;
            padding: 2px 7px;
            font-size: 11px;
            letter-spacing: 0.5px;
            border: 1px solid currentColor;
            border-radius: 2px;
        }
        .badge.type-BookLinks { color: var(--badge-green); background: #f0f6f2; } 
        .badge.type-Froms { color: var(--badge-blue); background: #f0f4f8; }     
        .badge.type-Comments { color: var(--badge-purple); background: #f7f0f7; }  
        .badge.type-Fallback { color: var(--badge-gray); background: #f5f5f5; }

        .source-meta-title {
            font-size: 14.5px;
            font-weight: bold;
            color: #2b2823;
            letter-spacing: 0.5px;
        }
        
        .source-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .citation-content {
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--text-main);
            word-break: break-word;
            /* 标准学术文献格式：悬挂缩进 */
            padding-left: 2.2em;
            text-indent: -2.2em;
            letter-spacing: 0.2px;
        }
        
        .citation-content pre {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            text-indent: 0;
            padding: 10px 14px;
            background: #f6f3ed;
            border: 1px solid #e5dfd2;
            color: #3b352b;
            border-radius: 2px;
        }

        /* ---------------------------------------------
           古籍原典前后文语境透视面板 (典雅古籍整理本排印体例)
           --------------------------------------------- */
        .source-context-panel {
            margin-top: 14px;
            background: #faf8f3;
            border: 1px solid #e5dccf;
            border-left: 3px solid var(--primary);
            padding: 14px 18px;
            border-radius: 2px;
            animation: fadeInContext 0.25s ease-in-out;
            text-indent: 0;
            position: relative;
        }

        @keyframes fadeInContext {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .context-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-light);
            border-bottom: 1px dashed #e8e0d3;
            padding-bottom: 6px;
            text-indent: 0;
        }

        .context-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-tag {
            color: var(--primary);
            font-weight: 500;
            font-family: var(--font-classical);
            letter-spacing: 0.5px;
        }

        .context-flow {
            font-family: var(--font-classical);
            font-size: 14px;
            line-height: 2.0;
            color: #38322a;
            text-align: justify;
        }

        /* 结构化三段式 (前文 · 本篇 · 后文) */
        .context-section {
            margin-bottom: 12px;
            position: relative;
        }
        .context-section:last-child {
            margin-bottom: 0;
        }

        .context-sec-badge {
            display: inline-block;
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 2px;
            margin-right: 8px;
            user-select: none;
            vertical-align: middle;
            font-family: var(--font-classical);
            letter-spacing: 0.5px;
        }

        .context-prev-badge {
            background: #f0eae0;
            color: #7a7062;
            border: 1px solid #ded5c5;
        }

        .context-match-badge {
            background: rgba(140, 67, 86, 0.1);
            color: var(--primary);
            border: 1px solid rgba(140, 67, 86, 0.3);
            font-weight: 500;
        }

        .context-later-badge {
            background: #f0eae0;
            color: #7a7062;
            border: 1px solid #ded5c5;
        }

        .context-prev-sec .context-sec-body,
        .context-later-sec .context-sec-body {
            color: #696156;
            font-size: 13.5px;
            line-height: 1.95;
        }

        /* 核心本篇实况卡片：古雅聚焦 */
        .context-match-sec {
            margin: 10px 0;
        }
        .context-match-card {
            background: rgba(140, 67, 86, 0.04);
            border-left: 2.5px solid var(--primary);
            padding: 8px 14px;
            margin-top: 6px;
            color: #2b2b2b;
            font-size: 14px;
            line-height: 2.0;
            border-radius: 1px;
        }

        /* 诗句与检索词双重朱砂微晕 */
        .context-kw-highlight {
            background: rgba(140, 67, 86, 0.15);
            color: #8c4356;
            border-bottom: 2px solid #8c4356;
            padding: 0 2px;
            font-weight: 500;
        }

        /* 古籍原典叶码文人书叶微标 */
        .page-break-tag {
            display: inline-flex;
            align-items: center;
            color: #8c7355;
            background: #f2ebd9;
            border: 1px solid #ddd2be;
            border-radius: 2px;
            padding: 0 5px;
            font-size: 11px;
            line-height: 1.5;
            margin: 0 4px;
            vertical-align: baseline;
            user-select: none;
            font-family: var(--font-classical);
            letter-spacing: 0.5px;
        }

        /* 文人小字夹注 / 双行注 */
        .context-annotation {
            font-size: 0.88em;
            color: #7d7265;
            background: rgba(0, 0, 0, 0.02);
            padding: 0 2px;
            border-radius: 2px;
            font-style: normal;
        }

        /* 词律韵位标记 */
        .metre-badge {
            font-size: 10.5px;
            color: #8c7b68;
            background: #ebe4d5;
            border: 1px solid #ded5c5;
            border-radius: 2px;
            padding: 0 3px;
            margin: 0 3px;
            vertical-align: baseline;
        }

        /* 超长语境折叠与渐变蒙层 */
        .context-scroll-wrap {
            max-height: 260px;
            overflow: hidden;
            position: relative;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .context-scroll-wrap.expanded {
            max-height: none;
        }

        .context-gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: linear-gradient(transparent, #faf8f3 80%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2px;
        }
        .context-scroll-wrap.expanded .context-gradient-overlay {
            position: static;
            height: auto;
            background: none;
            margin-top: 10px;
        }

        .context-expand-btn {
            background: #f4eee2;
            border: 1px solid #d8cebe;
            color: var(--primary);
            font-family: var(--font-classical);
            font-size: 12px;
            padding: 3px 16px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .context-expand-btn:hover {
            background: #eae2d2;
            color: var(--primary-hover);
        }

        .action-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* ---------------------------------------------
           其余备用出处折叠面板
           --------------------------------------------- */
        details.more-sources {
            margin-top: 16px;
            border: 1px solid #eae2d3;
            background: #fcfbf8;
            border-radius: 2px;
        }
        details.more-sources summary {
            padding: 10px 15px;
            font-size: 13.5px;
            color: var(--text-light);
            cursor: pointer;
            list-style: none;
            text-align: center;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        details.more-sources summary::-webkit-details-marker { display: none; }
        details.more-sources summary:hover {
            color: var(--primary);
            background: #f7f4ed;
        }
        .details-content {
            padding: 14px;
            border-top: 1px solid #eae2d3;
            background: #ffffff;
        }

        /* ---------------------------------------------
           原书影印 Lightbox 模态框
           --------------------------------------------- */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 15, 0.88);
            z-index: 1001;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .lightbox-content {
            max-width: 960px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            background: #222;
            border: 1px solid #444;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .lightbox-header {
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            border-bottom: 1px solid #333;
        }
        .lightbox-title { color: #f1ebd8; font-size: 14px; letter-spacing: 1px; }
        .lightbox-close { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .lightbox-close:hover { color: #fff; }
        .lightbox-img-wrapper {
            padding: 20px;
            min-height: 400px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #141414;
            position: relative;
        }

        .lightbox-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: var(--font-classical);
            color: #d8cebe;
            padding: 40px 20px;
            user-select: none;
        }

        .classical-spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(216, 206, 190, 0.2);
            border-top-color: #d1c7b7;
            border-radius: 50%;
            animation: spinClassical 1s linear infinite;
        }

        @keyframes spinClassical {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            letter-spacing: 2px;
            color: #f1ebd8;
        }

        .loading-subtext {
            font-size: 12px;
            color: #8c8273;
            letter-spacing: 1px;
        }

        .lightbox-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            font-family: var(--font-classical);

        .lightbox-img-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .lightbox-img-wrapper img.loaded {
            opacity: 1;
        }

        .lightbox-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;

        .lightbox-page-tag {
            background: rgba(216, 206, 190, 0.15);
            color: #d8cebe;
            border: 1px solid rgba(216, 206, 190, 0.35);

        .lightbox-header-nav {

        .nav-page-btn {
            background: rgba(255, 255, 255, 0.08);

            color: #f1ebd8;
            font-family: var(--font-classical);
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-page-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .nav-page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* 左右悬浮翻页大箭头 */
        .float-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 26, 23, 0.65);
            border: 1px solid rgba(216, 206, 190, 0.25);
            color: #f1ebd8;
            font-size: 26px;
            line-height: 1;
            width: 44px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            border-radius: 3px;
            transition: all 0.2s ease;
            user-select: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .float-nav-btn:hover:not(:disabled) {
            background: rgba(140, 67, 86, 0.85);
            border-color: var(--primary);
            color: #fff;
        }

        .float-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .float-prev {
            left: 16px;
        }

        .float-next {
            right: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Hero Section -->
        <div class="hero-wrapper" id="heroWrapper">
            <div class="header">
                <h1>搜韵网收录诗文出处循证系统</h1>
                <p class="subtitle">寻根溯源 · 明辨底本</p>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入诗词名或诗句，如：登鹳雀楼" onkeypress="handleKeyPress(event)">
                <button class="main-btn" id="searchBtn" onclick="performSearch()">探 索</button>
            </div>
        </div>

        <!-- 全局格式联动控制器与整页出处引文一键复制 -->
        <div class="global-format-selector" id="formatSelector" style="display: none;">
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="g_format" value="basic" checked onchange="updateAllFormats()"> 基础格式</label>
                <label class="radio-label"><input type="radio" name="g_format" value="gbt7714" onchange="updateAllFormats()"> 国标 (GB/T 7714)</label>
                <label class="radio-label"><input type="radio" name="g_format" value="academic" onchange="updateAllFormats()"> 古籍传统学术</label>
                <label class="radio-label"><input type="radio" name="g_format" value="mla" onchange="updateAllFormats()"> MLA 9th</label>
                <label class="radio-label"><input type="radio" name="g_format" value="bibtex" onchange="updateAllFormats()"> BibTeX (LaTeX)</label>
            </div>
            <div class="format-actions">
                <button class="action-btn" id="copyAllBtn" onclick="copyAllDisplayedCitations(this)" title="一键复制当前检索到的全部诗文首选出处引文">📋 复制全部出处引文</button>
            </div>
        </div>

        <div id="statusBar" class="status-bar"></div>
        <div id="resultsArea"></div>
    </div>

    <!-- 原书影印 Lightbox 模态框 -->
    <div id="imageLightbox" class="lightbox-overlay" style="display: none;" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div class="lightbox-header">
                <div class="lightbox-header-left">
                    <span id="lightboxTitle" class="lightbox-title">古籍原典高清扫描件</span>
                    <span id="lightboxPageIndicator" class="lightbox-page-tag" style="display: none;">第 1 / 1 叶</span>
                </div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <div id="lightboxHeaderNav" class="lightbox-header-nav" style="display: none;">
                        <button class="nav-page-btn" id="headerPrevBtn" onclick="prevLightboxPage()" title="上一叶 (快捷键 ←)">‹ 上一叶</button>
                        <button class="nav-page-btn" id="headerNextBtn" onclick="nextLightboxPage()" title="下一叶 (快捷键 →)">下一叶 ›</button>
                    </div>
                    <a id="lightboxRawLink" href="#" target="_blank" class="action-btn" style="color:#f1ebd8; border-color:#888; background:transparent;">新标签页看大图 ↗</a>
                    <button class="lightbox-close" onclick="closeLightboxDirect()">✕</button>
                </div>
            </div>
            <div class="lightbox-img-wrapper">
                <button class="float-nav-btn float-prev" id="floatPrevBtn" onclick="prevLightboxPage()" title="上一叶 (快捷键 ←)" style="display: none;">‹</button>
                <div id="lightboxLoading" class="lightbox-loading">
                    <div class="classical-spinner"></div>
                    <div class="loading-text">正在从古籍典藏库调取高清书影...</div>
                    <div class="loading-subtext">四部丛刊 · 历代原刻善本扫描件</div>
                </div>
                <div id="lightboxError" class="lightbox-error" style="display: none;">
                    <div style="font-size: 26px; margin-bottom: 10px;">📜</div>
                    <div style="color: #e5b9b9; font-size: 14px; margin-bottom: 14px;">古籍影像服务器响应较慢或暂时受限</div>
                    <a id="lightboxErrorLink" href="#" target="_blank" class="action-btn" style="color: #f1ebd8; border-color: #886666; background: transparent;">在新标签页尝试直接打开原图 ↗</a>
                </div>
                <img id="lightboxImg" src="" alt="古籍原书书影" style="display: none;" />
                <button class="float-nav-btn float-next" id="floatNextBtn" onclick="nextLightboxPage()" title="下一叶 (快捷键 →)" style="display: none;">›</button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 无死锁双模生命周期守护与防节流心跳
        // -------------------------------------------------------------
        let lastPingTime = 0;
        function sendHeartbeat() {
            const now = Date.now();
            if (now - lastPingTime < 3000) return;
            lastPingTime = now;
            fetch('/api/ping', { method: 'POST', cache: 'no-store' }).catch(() => {});
        }

        setInterval(sendHeartbeat, 10000);
        sendHeartbeat();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') sendHeartbeat();
        });
        window.addEventListener('focus', sendHeartbeat);
        document.addEventListener('click', sendHeartbeat);
        document.addEventListener('keydown', sendHeartbeat);

        window.addEventListener('beforeunload', () => {
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/exit', JSON.stringify({ action: 'unload' }));
            } else {
                fetch('/api/exit', { method: 'POST', keepalive: true }).catch(() => {});
            }
        });

        window.poemDataMap = {};
        window.allPoemResults = [];
        window.currentSearchId = 0;
        window.currentSearchQuery = '';

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function extractKeywords(query) {
            if (!query) return [];
            const rawTerms = query.split(/[，。！？；：“”‘’（）《》、\s,.!?;:()\[\]"'·\-—]+/);
            const set = new Set();
            const trimmed = query.trim();
            if (trimmed) set.add(trimmed);
            for (let term of rawTerms) {
                term = term.trim();
                if (term.length > 0) set.add(term);
            }
            return Array.from(set).sort((a, b) => b.length - a.length);
        }

        function highlightKeywords(text, query) {
            if (!text) return '';
            const safeText = escapeHtml(text);
            const keywords = extractKeywords(query);
            if (keywords.length === 0) return safeText;

            const regexParts = [];
            for (let kw of keywords) {
                const escapedKw = escapeHtml(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (escapedKw) regexParts.push(escapedKw);
            }
            if (regexParts.length === 0) return safeText;

            const regex = new RegExp('(' + regexParts.join('|') + ')', 'gi');
            return safeText.replace(regex, '<span class="keyword-highlight">$1</span>');
        }

        function cleanClassicalContextText(raw) {
            if (!raw) return '';
            let s = String(raw);

            // 1. 过滤数据库代码与元数据注释 (# src: ... # dating: ...)
            s = s.replace(/#\s*(src|dating):[^\r\n]*/gi, '');

            // 2. 预先处理叶码前后换行，将其平滑独立
            s = s.replace(/[\r\n\s]*(<(pb|md):[^>]+>)[\r\n\s]*/g, ' $1 ');

            // 3. 缝合 OCR 双行小字注断裂: ")\n(" 缝合为连续注记
            s = s.replace(/\)\s*[\r\n]+[\s\u3000]*\(/g, '');
            s = s.replace(/）\s*[\r\n]+[\s\u3000]*（/g, '');

            // 4. 清除 OCR 列断斜杠噪点 (如 "(一作/天)", "开元之/盛矣", "(韵/)")
            s = s.replace(/\s*\/\s*/g, '');

            // 5. 规整词曲格律标记
            s = s.replace(/[（\(]韵[）\)]/g, '〔韵〕')
                 .replace(/[（\(]叶[）\)]/g, '〔叶〕')
                 .replace(/[（\(]句[）\)]/g, '〔句〕')
                 .replace(/丨丨/g, '〔同上〕');

            // 6. 版刻列宽伪换行智能合并
            const rawLines = s.split(/\r?\n/);
            let merged = [];
            for (let i = 0; i < rawLines.length; i++) {
                let cur = rawLines[i].trim();
                if (!cur) continue;

                if (merged.length > 0) {
                    let prev = merged[merged.length - 1];
                    // 判断是否平滑连缀：
                    // 若上一行结尾不是终结标点（。！？；），且当前行不是新起首（如 〇、按、题名等）
                    let shouldMerge = false;
                    if (!/[。！？；:：]$/.test(prev) &&
                        !/[曰云按]$/.test(prev) &&
                        !/^[〇《#]/.test(cur) &&
                        !/^(按|题|前题|诗曰|赋曰)/.test(cur)) {
                        shouldMerge = true;
                    }

                    if (shouldMerge) {
                        merged[merged.length - 1] = prev + cur;
                    } else {
                        merged.push(cur);
                    }
                } else {
                    merged.push(cur);
                }
            }
            s = merged.join('\n');

            // 7. 收敛连续全角空格与空白
            s = s.replace(/[\u3000\s]{3,}/g, ' ');

            // 8. 针对圈点符号 〇 换行并呼吸缩进
            s = s.replace(/〇/g, '\n〇 ');

            // 9. HTML 转义
            let safe = escapeHtml(s);

            // 10. 转译叶码微标：将 <pb:...> 与 <md:...> 转换为文人书叶徽标
            safe = safe.replace(/&lt;(pb|md):(?:[^&>]*?-)?(\d+)([a-zA-Z])&gt;/g, (match, type, page, leaf) => {
                const side = (leaf.toLowerCase() === 'a') ? '正' : (leaf.toLowerCase() === 'b' ? '背' : leaf);
                const pNum = parseInt(page, 10);
                return `<span class="page-break-tag" title="古籍原典书页：第${pNum}叶${side}">〔第${pNum}叶${side}〕</span>`;
            });
            safe = safe.replace(/&lt;(pb|md):(?:[^&>]*?-)?(\d+)&gt;/g, (match, type, page) => {
                const pNum = parseInt(page, 10);
                return `<span class="page-break-tag" title="古籍原典书页：第${pNum}叶">〔第${pNum}叶〕</span>`;
            });
            safe = safe.replace(/&lt;(pb|md):([^&>]+)&gt;/g, '<span class="page-break-tag" title="古籍原典书页标记">〔$2〕</span>');

            // 11. 将夹注文本样式化 (小字双行注、版本异文、校勘)
            safe = safe.replace(/(\([^\n<>()]{2,120}\)|（[^\n<>（）]{2,120}）|〈[^\n<>〈〉]{2,120}〉)/g, 
                '<span class="context-annotation">$1</span>');

            // 12. 格式化段落换行
            safe = safe.replace(/\n+/g, '<br>');

            return safe;
        }

        function highlightContextKeywords(htmlText, query) {
            if (!htmlText || !query) return htmlText;
            const kws = extractKeywords(query);
            if (kws.length === 0) return htmlText;
            
            // 拆分 HTML 标签与纯文本，安全高亮纯文本部分
            const parts = htmlText.split(/(<[^>]+>)/g);
            for (let i = 0; i < parts.length; i += 2) {
                let textPart = parts[i];
                for (let kw of kws) {
                    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp('(' + escaped + ')', 'gi');
                    textPart = textPart.replace(regex, '<span class="context-kw-highlight">$1</span>');
                }
                parts[i] = textPart;
            }
            return parts.join('');
        }

        function formatStructuredContext(prevRaw, matchRaw, laterRaw, query, wid, idx) {
            const cleanedPrev = cleanClassicalContextText(prevRaw);
            let cleanedMatch = cleanClassicalContextText(matchRaw);
            const cleanedLater = cleanClassicalContextText(laterRaw);

            if (query) {
                cleanedMatch = highlightContextKeywords(cleanedMatch, query);
            }

            const totalLen = (prevRaw || '').length + (matchRaw || '').length + (laterRaw || '').length;
            const isLong = totalLen > 320;

            let sections = [];
            if (cleanedPrev) {
                sections.push(`
                    <div class="context-section context-prev-sec">
                        <span class="context-sec-badge context-prev-badge">前文载录</span>
                        <span class="context-sec-body">${cleanedPrev}</span>
                    </div>
                `);
            }

            if (cleanedMatch) {
                sections.push(`
                    <div class="context-section context-match-sec">
                        <span class="context-sec-badge context-match-badge">本篇实况</span>
                        <div class="context-match-card">${cleanedMatch}</div>
                    </div>
                `);
            }

            if (cleanedLater) {
                sections.push(`
                    <div class="context-section context-later-sec">
                        <span class="context-sec-badge context-later-badge">后文续考</span>
                        <span class="context-sec-body">${cleanedLater}</span>
                    </div>
                `);
            }

            if (sections.length === 0) {
                return '<div class="context-flow" style="color:var(--text-light); font-style:italic;">原典前后文字符缺失或未录入</div>';
            }

            const innerHtml = sections.join('');

            if (isLong) {
                return `
                    <div class="context-scroll-wrap" id="context_wrap_${wid}_${idx}">
                        <div class="context-flow">${innerHtml}</div>
                        <div class="context-gradient-overlay" id="context_overlay_${wid}_${idx}">
                            <button class="context-expand-btn" onclick="toggleContextExpand(this, '${wid}', ${idx})">📜 展开全部典籍语境 (共约 ${totalLen} 字) ▾</button>
                        </div>
                    </div>
                `;
            } else {
                return `<div class="context-flow">${innerHtml}</div>`;
            }
        }

        function toggleContextExpand(btn, wid, idx) {
            const wrap = document.getElementById(`context_wrap_${wid}_${idx}`);
            if (!wrap) return;
            if (wrap.classList.contains('expanded')) {
                wrap.classList.remove('expanded');
                btn.innerHTML = `📜 展开全部典籍语境 ▾`;
            } else {
                wrap.classList.add('expanded');
                btn.innerHTML = `📜 收起部分语境 ▴`;
            }
        }

        function toggleContext(btn, wid, idx) {
            const panel = document.getElementById(`context_${wid}_${idx}`);
            if (!panel) return;
            if (panel.style.display === 'none' || !panel.style.display) {
                panel.style.display = 'block';
                btn.innerHTML = '📜 收起语境 ▴';
                btn.classList.add('active');
            } else {
                panel.style.display = 'none';
                btn.innerHTML = '📜 原典前后文 ▾';
                btn.classList.remove('active');
            }
        }
        
        function showStatus(message, type) {
            const bar = document.getElementById('statusBar');
            bar.className = 'status-bar status-' + type;
            bar.textContent = message;
            bar.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('statusBar').style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                const btn = document.getElementById('searchBtn');
                if (!btn.disabled) performSearch();
            }
        }

        async function copyToClipboard(btn, text) {
            const origHtml = btn.innerHTML;
            const successUI = () => {
                btn.innerHTML = '已复制';
                btn.style.background = 'var(--primary)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.style.background = '#fff';
                    btn.style.color = 'var(--primary)';
                }, 2000);
            };

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    successUI();
                } else {
                    let textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    successUI();
                }
            } catch (err) {
                alert('复制失败，请手动选取复制');
            }
        }

        async function copyCitationCard(btn, wid, idx) {
            const citData = window.poemDataMap[wid] ? window.poemDataMap[wid][idx] : null;
            if (!citData) return;
            const formatKey = getCurrentFormatKey();
            let text = citData.basic;
            if (formatKey === 'gbt7714') text = citData.gbt7714;
            else if (formatKey === 'academic') text = citData.academic;
            else if (formatKey === 'mla') text = citData.mla;
            else if (formatKey === 'bibtex') text = citData.bibtex || citData.basic;
            
            await copyToClipboard(btn, text);
        }

        async function copyAllDisplayedCitations(btn) {
            const formatKey = getCurrentFormatKey();
            let lines = [];
            let count = 0;
            
            for (let p of window.allPoemResults) {
                const cits = window.poemDataMap[p.id];
                if (!cits || cits.length === 0) continue;
                const bestCit = cits[0];
                count++;
                
                if (formatKey === 'gbt7714') {
                    lines.push(`[${count}] ${bestCit.gbt7714}`);
                } else if (formatKey === 'bibtex') {
                    lines.push(bestCit.bibtex || bestCit.basic);
                } else if (formatKey === 'academic') {
                    lines.push(`${count}. ${bestCit.academic}`);
                } else if (formatKey === 'mla') {
                    lines.push(`${count}. ${bestCit.mla}`);
                } else {
                    lines.push(`${count}. ${bestCit.basic}`);
                }
            }
            
            if (lines.length === 0) {
                alert('当前尚未加载出任何文献出处！');
                return;
            }
            
            const delimiter = (formatKey === 'bibtex') ? "\n\n" : "\n";
            const allText = lines.join(delimiter);
            
            const origHtml = btn.innerHTML;
            const successUI = () => {
                btn.innerHTML = `✓ 已复制全部 (${count} 首)`;
                btn.style.background = 'var(--primary)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.style.background = '#fff';
                    btn.style.color = 'var(--primary)';
                }, 2200);
            };

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(allText);
                    successUI();
                } else {
                    let textArea = document.createElement('textarea');
                    textArea.value = allText;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    successUI();
                }
            } catch (e) {
                alert('复制失败，请手动选取');
            }
        }
        
        function togglePoemText(btn) {
            const content = btn.parentElement.previousElementSibling;
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                btn.textContent = '展开全文';
            } else {
                content.classList.add('expanded');
                btn.textContent = '收起';
            }
        }

        function getCurrentFormatKey() {
            const checked = document.querySelector('input[name="g_format"]:checked');
            return checked ? checked.value : 'basic';
        }

        function updateAllFormats() {
            const formatKey = getCurrentFormatKey();
            document.querySelectorAll('.citation-text-node').forEach(node => {
                const wid = node.getAttribute('data-wid');
                const idx = node.getAttribute('data-idx');
                const citData = window.poemDataMap[wid] ? window.poemDataMap[wid][idx] : null;
                if (!citData) return;
                
                if (formatKey === 'bibtex') {
                    node.innerHTML = `<pre>${citData.bibtex || citData.basic}</pre>`;
                } else {
                    let text = citData.basic;
                    if (formatKey === 'gbt7714') text = citData.gbt7714;
                    else if (formatKey === 'academic') text = citData.academic;
                    else if (formatKey === 'mla') text = citData.mla;
                    node.textContent = text;
                }
            });
        }

        function renderSingleCitationCard(cit, wid, idx) {
            let badgeClass = 'type-Fallback';
            let badgeText = '文献出处';
            
            if (cit.source_type === '古籍实体影印本') {
                badgeClass = 'type-BookLinks';
                badgeText = '实体影印';
            } else if (cit.source_type === '文本底层录入来源') {
                badgeClass = 'type-Froms';
                badgeText = '底本录入';
            } else if (cit.source_type === '批注与收录记录') {
                badgeClass = 'type-Comments';
                badgeText = '批注收录';
            }
            
            let headerTitle = `《${cit.book}》`;
            if (cit.volume && cit.volume !== '无') headerTitle += ` ${cit.volume}`;
            if (cit.edition && cit.edition !== '无') headerTitle += ` | ${cit.edition}`;
            if (cit.book === '未知' || !cit.book) headerTitle = "搜韵网未注版本";
            
            const highlightedHeaderTitle = window.currentSearchQuery ? highlightKeywords(headerTitle, window.currentSearchQuery) : escapeHtml(headerTitle);

            const formatKey = getCurrentFormatKey();
            let initialContent = '';
            if (formatKey === 'bibtex') {
                initialContent = `<pre>${cit.bibtex || cit.basic}</pre>`;
            } else {
                let text = cit.basic;
                if (formatKey === 'gbt7714') text = cit.gbt7714;
                else if (formatKey === 'academic') text = cit.academic;
                else if (formatKey === 'mla') text = cit.mla;
                initialContent = text;
            }

            let imageBtnHtml = '';
            if (cit.has_images && (cit.first_image_url || (cit.images && cit.images.length > 0))) {
                let safeTitle = (headerTitle + ' 原书书影').replace(/'/g, "\'");
                let countBadge = (cit.images && cit.images.length > 1) ? ` (${cit.images.length}叶)` : '';
                imageBtnHtml = `<button class="action-btn" onclick="openLightbox('${wid}', ${idx}, '${safeTitle}')" title="全屏高清阅览原书扫描件（支持连续跨页翻阅）">🖼️ 原书书影${countBadge}</button>`;
            }

            let contextBtnHtml = '';
            let contextPanelHtml = '';
            if (cit.has_context) {
                contextBtnHtml = `<button class="action-btn" onclick="toggleContext(this, '${wid}', ${idx})" title="展开查验古籍原典收录本诗之前后文真实语境">📜 原典前后文 ▾</button>`;
                
                const structuredHtml = formatStructuredContext(
                    cit.previous_text,
                    cit.matched_text,
                    cit.later_text,
                    window.currentSearchQuery,
                    wid,
                    idx
                );
                
                contextPanelHtml = `
                    <div class="source-context-panel" id="context_${wid}_${idx}" style="display: none;">
                        <div class="context-header">
                            <div class="context-header-left">
                                <span class="context-tag">📜 古籍原典载录语境透视</span>
                                <span>（还原典籍刻印版面及前后文）</span>
                            </div>
                        </div>
                        ${structuredHtml}
                    </div>
                `;
            }

            return `
                <div class="source-container">
                    <div class="source-card">
                        <div class="source-header">
                            <div class="source-meta-left">
                                <span class="badge ${badgeClass}">${badgeText}</span>
                                <span class="source-meta-title">${highlightedHeaderTitle}</span>
                            </div>
                            
                            <div class="source-actions">
                                ${contextBtnHtml}
                                ${imageBtnHtml}
                                <button class="action-btn" onclick="copyCitationCard(this, '${wid}', ${idx})">📋 复制</button>
                            </div>
                        </div>
                        
                        <div class="citation-content citation-text-node" data-wid="${wid}" data-idx="${idx}">${initialContent}</div>
                        ${contextPanelHtml}
                    </div>
                </div>
            `;
        }

        async function fetchSources(wid, raw_w, containerId, searchId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (searchId !== window.currentSearchId) return;
            container.innerHTML = '<div class="classical-divider">正在发掘底层书证</div>';
            
            try {
                const response = await fetch('/api/booklinks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: wid, raw_w: raw_w })
                });
                
                if (!response.ok) {
                    let errMsg = `出处提取失败 (HTTP ${response.status})`;
                    try {
                        const errJson = await response.json();
                        if (errJson && errJson.error) errMsg = errJson.error;
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                
                if (!data.citations || data.citations.length === 0) {
                    container.innerHTML = '<div class="classical-divider">未找到任何出处</div>';
                    return;
                }

                window.poemDataMap[wid] = data.citations;

                let html = '<div class="classical-divider">典籍出处</div>';
                html += renderSingleCitationCard(data.citations[0], wid, 0);
                
                if (data.citations.length > 1) {
                    const remainingCount = data.citations.length - 1;
                    html += `<details class="more-sources">
                                <summary>展开其余 ${remainingCount} 个版本出处 ▾</summary>
                                <div class="details-content">`;
                    
                    for (let i = 1; i < data.citations.length; i++) {
                        html += renderSingleCitationCard(data.citations[i], wid, i);
                    }
                    
                    html += `</div></details>`;
                }
                
                container.innerHTML = html;
                
            } catch (error) {
                container.innerHTML = `<div class="classical-divider" style="color:var(--primary)">提取失败: ${error.message}</div>`;
            }
        }

        // 原书影印 Lightbox (支持多页连续翻阅、键盘左右切页)
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;
        let currentLightboxTitle = '';

        function openLightbox(wid, idx, title) {
            currentLightboxImages = [];
            currentLightboxIndex = 0;
            currentLightboxTitle = title || '古籍原典高清扫描件';

            if (typeof idx === 'number' && window.poemDataMap && window.poemDataMap[wid] && window.poemDataMap[wid][idx]) {
                const cit = window.poemDataMap[wid][idx];
                if (cit.images && Array.isArray(cit.images) && cit.images.length > 0) {
                    currentLightboxImages = cit.images;
                } else if (cit.first_image_url) {
                    currentLightboxImages = [cit.first_image_url];
                }
            } else if (typeof wid === 'string' && (wid.startsWith('http') || wid.startsWith('/') || wid.includes('://'))) {
                // 向后兼容直接传图片 URL 的场景
                currentLightboxImages = [wid];
                if (typeof idx === 'string') currentLightboxTitle = idx;
            }

            if (currentLightboxImages.length === 0) return;

            const lightbox = document.getElementById('imageLightbox');
            lightbox.style.display = 'flex';
            updateLightboxPage(0);
        }

        function updateLightboxPage(index) {
            if (!currentLightboxImages || currentLightboxImages.length === 0) return;
            if (index < 0) index = 0;
            if (index >= currentLightboxImages.length) index = currentLightboxImages.length - 1;
            currentLightboxIndex = index;

            const total = currentLightboxImages.length;
            const imgUrl = currentLightboxImages[index];

            const pageIndicator = document.getElementById('lightboxPageIndicator');
            const headerNav = document.getElementById('lightboxHeaderNav');
            const floatPrev = document.getElementById('floatPrevBtn');
            const floatNext = document.getElementById('floatNextBtn');
            const headerPrev = document.getElementById('headerPrevBtn');
            const headerNext = document.getElementById('headerNextBtn');

            document.getElementById('lightboxTitle').textContent = currentLightboxTitle;
            document.getElementById('lightboxRawLink').href = imgUrl;
            const errorLink = document.getElementById('lightboxErrorLink');
            if (errorLink) errorLink.href = imgUrl;

            // 多页状态控制器联动
            if (total > 1) {
                if (pageIndicator) {
                    pageIndicator.style.display = 'inline-block';
                    pageIndicator.textContent = `第 ${index + 1} / ${total} 叶`;
                }
                if (headerNav) headerNav.style.display = 'flex';
                if (floatPrev) {
                    floatPrev.style.display = 'flex';
                    floatPrev.disabled = (index === 0);
                }
                if (floatNext) {
                    floatNext.style.display = 'flex';
                    floatNext.disabled = (index === total - 1);
                }
                if (headerPrev) headerPrev.disabled = (index === 0);
                if (headerNext) headerNext.disabled = (index === total - 1);
            } else {
                if (pageIndicator) pageIndicator.style.display = 'none';
                if (headerNav) headerNav.style.display = 'none';
                if (floatPrev) floatPrev.style.display = 'none';
                if (floatNext) floatNext.style.display = 'none';
            }

            // 初始状态：显示典雅古籍载入动画，隐藏图片与错误信息
            const img = document.getElementById('lightboxImg');
            const loading = document.getElementById('lightboxLoading');
            const errorBox = document.getElementById('lightboxError');

            loading.style.display = 'flex';
            errorBox.style.display = 'none';
            img.style.display = 'none';
            img.classList.remove('loaded');

            img.onload = function() {
                loading.style.display = 'none';
                errorBox.style.display = 'none';
                img.style.display = 'block';
                requestAnimationFrame(() => {
                    img.classList.add('loaded');
                });
            };

            img.onerror = function() {
                loading.style.display = 'none';
                img.style.display = 'none';
                errorBox.style.display = 'flex';
            };

            img.src = imgUrl;
        }

        function prevLightboxPage() {
            if (currentLightboxIndex > 0) {
                updateLightboxPage(currentLightboxIndex - 1);
            }
        }

        function nextLightboxPage() {
            if (currentLightboxIndex < currentLightboxImages.length - 1) {
                updateLightboxPage(currentLightboxIndex + 1);
            }
        }

        function closeLightbox(e) {
            if (e.target.id === 'imageLightbox') closeLightboxDirect();
        }

        function closeLightboxDirect() {
            const lightbox = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImg');
            lightbox.style.display = 'none';
            img.onload = null;
            img.onerror = null;
            img.src = '';
            img.classList.remove('loaded');
            currentLightboxImages = [];
            currentLightboxIndex = 0;
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('imageLightbox');
            if (!lightbox || lightbox.style.display === 'none') return;

            if (e.key === 'Escape') {
                closeLightboxDirect();
            } else if (e.key === 'ArrowLeft') {
                prevLightboxPage();
            } else if (e.key === 'ArrowRight') {
                nextLightboxPage();
            }
        });

        async function performSearch() {
            const searchInput = document.getElementById('searchInput');
            let query = searchInput.value;
            // 清洗全角空格、零宽空格与多余空白
            query = query.replace(/[\s\u3000\u00a0\u200b\ufeff\r\n\t]+/g, ' ').trim();
            if (!query) return;
            searchInput.value = query;
            
            searchInput.blur();

            const searchId = ++window.currentSearchId;
            window.currentSearchQuery = query;
            const btn = document.getElementById('searchBtn');
            const resultsArea = document.getElementById('resultsArea');
            const formatSelector = document.getElementById('formatSelector');
            const heroWrapper = document.getElementById('heroWrapper');
            
            heroWrapper.classList.add('compact');

            btn.disabled = true;
            btn.textContent = '探索中...';
            resultsArea.innerHTML = '';
            window.poemDataMap = {}; 
            window.allPoemResults = [];
            formatSelector.style.display = 'none';
            
            showStatus(`正在搜韵网古籍库检索 "${query}"...`, 'loading');

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    let errMsg = `搜韵网接口响应异常 (HTTP ${response.status})`;
                    try {
                        const errJson = await response.json();
                        if (errJson && errJson.error) errMsg = errJson.error;
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                const data = await response.json();
                
                if (!data.results || data.results.length === 0) {
                    showStatus('未找到相关诗词，请尝试更换关键词。', 'warning');
                    btn.disabled = false;
                    btn.textContent = '探 索';
                    return;
                }

                window.allPoemResults = data.results;

                showStatus(`成功锁定 ${data.results.length} 首目标，正在并发透视底层来源...`, 'success');
                formatSelector.style.display = 'flex'; 

                for (let p of data.results) {
                    const card = document.createElement('div');
                    card.className = 'poem-card';
                    const containerId = `sources_${p.id}`;
                    const fullText = p.clauses.join('');
                    
                    const highlightedTitle = highlightKeywords(p.title, query);
                    const highlightedAuthor = highlightKeywords(p.author, query);
                    const highlightedDynasty = highlightKeywords(p.dynasty, query);
                    const highlightedContent = highlightKeywords(fullText, query);
                    const hasBodyMatch = highlightedContent.includes('class="keyword-highlight"');

                    let criticismHtml = '';
                    if (p.comments && p.comments.length > 0) {
                        let itemsHtml = p.comments.map(c => `
                            <div class="criticism-item">
                                <div class="criticism-book">〔${escapeHtml(c.book)}〕</div>
                                <div class="criticism-content">${escapeHtml(c.content)}</div>
                            </div>
                        `).join('');
                        
                        criticismHtml = `
                            <div class="criticism-container">
                                <details class="criticism-details">
                                    <summary>
                                        <span class="criticism-badge">名家汇评</span>
                                        <span class="criticism-title">历代名家汇评与诗话集释</span>
                                        <span class="criticism-count">（收录 ${p.comments.length} 部典籍批点）</span>
                                        <span class="criticism-arrow">▾</span>
                                    </summary>
                                    <div class="criticism-list">
                                        ${itemsHtml}
                                    </div>
                                </details>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="poem-header">
                            <h3 class="poem-title">${highlightedTitle}</h3>
                            <div class="poem-meta">
                                <span>〔${highlightedDynasty}〕${highlightedAuthor}</span>
                                <span>${p.type}</span>
                            </div>
                        </div>
                        
                        <div class="poem-content-wrapper">
                            <div class="poem-content">${highlightedContent}</div>
                            <div class="poem-gradient">
                                <button class="expand-btn" onclick="togglePoemText(this)">展开全文</button>
                            </div>
                        </div>
                        
                        ${criticismHtml}
                        
                        <div id="${containerId}"></div>
                    `;
                    resultsArea.appendChild(card);
                    
                    setTimeout(() => {
                        const contentDiv = card.querySelector('.poem-content');
                        const gradientDiv = card.querySelector('.poem-gradient');
                        const expandBtn = card.querySelector('.expand-btn');

                        if (contentDiv.scrollHeight <= contentDiv.clientHeight) {
                            gradientDiv.style.display = 'none';
                        } else if (hasBodyMatch) {
                            contentDiv.classList.add('expanded');
                            expandBtn.textContent = '收起';
                        }
                    }, 50);
                    
                    if (searchId === window.currentSearchId) {
                        await fetchSources(p.id, p.raw_w, containerId, searchId);
                    }
                    await new Promise(r => setTimeout(r, 500)); 
                }
                
                if (searchId === window.currentSearchId) {
                    showStatus(`所有目标的底层来源已全部透视完毕。`, 'success');
                    setTimeout(hideStatus, 4000);
                }

            } catch (error) {
                if (searchId === window.currentSearchId) {
                    showStatus(`检索出错: ${error.message}`, 'error');
                }
            } finally {
                if (searchId === window.currentSearchId) {
                    btn.disabled = false;
                    btn.textContent = '探 索';
                }
            }
        }
    </script>
</body>
