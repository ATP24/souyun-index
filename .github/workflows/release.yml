name: Build and Release

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install pyinstaller requests urllib3
    - name: Build with PyInstaller
      working-directory: ./src
      run: pyinstaller --noconfirm --onefile --windowed --add-data "index.html;." --name "souyun-index-windows" server.py
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: src/dist/souyun-index-windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install pyinstaller requests urllib3
    - name: Build with PyInstaller
      working-directory: ./src
      run: pyinstaller --noconfirm --onefile --windowed --add-data "index.html:." --name "souyun-index-mac" server.py
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: src/dist/souyun-index-mac
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
